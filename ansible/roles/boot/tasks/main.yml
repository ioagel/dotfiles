---
- name: Detect root mount before changing boot configuration
  ansible.builtin.command: findmnt -no SOURCE -T /
  register: root_mount_source
  changed_when: false
  check_mode: false

- name: Refuse non-encrypted mode on an encrypted root
  ansible.builtin.assert:
    that: (enable_encryption | bool) or 'cryptroot' not in root_mount_source.stdout
    fail_msg: >-
      Root is mounted from cryptroot, but enable_encryption is false. Refusing
      to replace the working encrypted boot configuration.

- name: Require existing USB-key encrypted Btrfs boot configuration
  ansible.builtin.assert:
    that:
      - encrypted_device | length > 0
      - luks_usb_keyfile is match('^/efi/[^/]+$')
      - encrypted_grub_efi_loader is match('^/efi/.+[.]efi$')
      - encrypted_grub_early_config is match('^/efi/.+[.]cfg$')
      - mkinitcpio_files | length == 0
    fail_msg: >-
      Encrypted boot must already be provisioned with an external USB key and
      GRUB EFI loader; pass their paths explicitly and keep mkinitcpio_files
      empty. This role will not create a key, add a LUKS slot, or embed a key.
  when: enable_encryption

- name: Check encrypted root and USB boot files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ luks_usb_keyfile }}"
    - "{{ encrypted_grub_efi_loader }}"
    - "{{ encrypted_grub_early_config }}"
  register: encrypted_boot_files
  when: enable_encryption

- name: Refuse to alter an incompletely provisioned encrypted boot
  ansible.builtin.assert:
    that: encrypted_boot_files.results | map(attribute='stat.exists') | min
    fail_msg: "USB key, GRUB EFI loader, or early GRUB config is missing."
  when: enable_encryption

- name: Check that /boot is inside Btrfs root
  ansible.builtin.command: findmnt -no FSTYPE,TARGET -T /boot
  register: boot_mount
  changed_when: false
  check_mode: false
  when: enable_encryption

- name: Refuse separate or unencrypted /boot for this boot mode
  ansible.builtin.assert:
    that: boot_mount.stdout.split() == ['btrfs', '/']
    fail_msg: "Encrypted boot requires /boot inside the Btrfs root filesystem."
  when: enable_encryption

- name: Get UUID of encrypted device
  ansible.builtin.command: "blkid -s UUID -o value {{ encrypted_device }}"
  register: encrypted_device_uuid
  when: enable_encryption
  changed_when: false
  check_mode: false

- name: Identify USB EFI filesystem
  ansible.builtin.command: findmnt -no SOURCE,FSTYPE,TARGET -T /efi
  register: efi_mount
  changed_when: false
  check_mode: false
  when: enable_encryption

- name: Require a separately mounted FAT EFI filesystem
  ansible.builtin.assert:
    that:
      - efi_mount.stdout.split()[1:] == ['vfat', '/efi']
    fail_msg: "/efi must be a separately mounted FAT filesystem containing the USB key."
  when: enable_encryption

- name: Get UUID of USB EFI filesystem
  ansible.builtin.command: "blkid -s UUID -o value {{ efi_mount.stdout.split()[0] }}"
  register: efi_device_uuid
  changed_when: false
  check_mode: false
  when: enable_encryption

- name: Verify existing USB key unlocks encrypted root
  ansible.builtin.command: >-
    cryptsetup open --test-passphrase --key-file {{ luks_usb_keyfile }} {{ encrypted_device }}
  changed_when: false
  check_mode: false
  no_log: true
  when: enable_encryption

- name: Configure mkinitcpio.conf for encryption
  ansible.builtin.lineinfile:
    path: /etc/mkinitcpio.conf
    regexp: "^HOOKS="
    line: "HOOKS=({{ mkinitcpio_hooks_encrypted }})"
    backup: true
  when: enable_encryption

- name: Configure mkinitcpio.conf for non-encryption
  ansible.builtin.lineinfile:
    path: /etc/mkinitcpio.conf
    regexp: "^HOOKS="
    line: "HOOKS=({{ mkinitcpio_hooks_normal }})"
    backup: true
  when: not enable_encryption

- name: Set required initramfs modules
  ansible.builtin.set_fact:
    mkinitcpio_modules_final: >-
      {{ (mkinitcpio_modules + (['vfat', 'usb_storage', 'uas'] if enable_encryption else [])) | unique | list }}

- name: Configure mkinitcpio MODULES
  ansible.builtin.lineinfile:
    path: /etc/mkinitcpio.conf
    regexp: "^MODULES="
    line: "MODULES=({{ mkinitcpio_modules_final | join(' ') }})"
    backup: true

- name: Configure mkinitcpio FILES
  ansible.builtin.lineinfile:
    path: /etc/mkinitcpio.conf
    regexp: "^FILES="
    line: "FILES=({{ mkinitcpio_files | join(' ') }})"
    backup: true

- name: Regenerate initramfs
  ansible.builtin.shell: |
    set -o pipefail
    mkinitcpio -P
  args:
    executable: /bin/bash
    chdir: /
  environment:
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  changed_when: true

- name: Configure GRUB timeout
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: "^GRUB_TIMEOUT="
    line: "GRUB_TIMEOUT={{ grub_timeout }}"
    backup: true

- name: Configure GRUB default entry
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: "^GRUB_DEFAULT="
    line: "GRUB_DEFAULT={{ grub_default }}"
    backup: true

- name: Configure GRUB submenu setting
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: "^#?GRUB_DISABLE_SUBMENU="
    line: "GRUB_DISABLE_SUBMENU={{ grub_disable_submenu | lower }}"
    backup: true

- name: Gather hardware facts
  ansible.builtin.setup:
    gather_subset:
      - hardware

# AMD Polaris GPU workarounds for scheduler spam (amdgpu.reset_method=0 amdgpu.runpm=0) on linux 6.12+
- name: Check for AMD Polaris GPU
  ansible.builtin.shell: |
    set -o pipefail
    lspci -nn | grep -E "1002:(67df|6fdf|6798|6818|6819)" || true
  register: polaris_gpu_check
  changed_when: false
  check_mode: false

- name: Set Polaris GPU detection fact
  ansible.builtin.set_fact:
    has_polaris_gpu: "{{ polaris_gpu_check.stdout | length > 0 }}"

- name: Build GRUB command line defaults
  ansible.builtin.set_fact:
    grub_cmdline_final: >-
      {{ grub_cmdline_linux_default }}{{
      has_polaris_gpu | ternary(' amdgpu.reset_method=0 amdgpu.runpm=0', '') }}

- name: Display detected GPU information
  ansible.builtin.debug:
    msg: "AMD Polaris GPU detected: {{ has_polaris_gpu }}"
  when: has_polaris_gpu

- name: Configure GRUB command line defaults
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: "^GRUB_CMDLINE_LINUX_DEFAULT="
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="{{ grub_cmdline_final }}"'
    backup: true

- name: Configure GRUB for encryption with UUID
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: "^GRUB_CMDLINE_LINUX="
    line: >-
      GRUB_CMDLINE_LINUX="cryptdevice=UUID={{ encrypted_device_uuid.stdout }}:cryptroot
      root=/dev/mapper/cryptroot
      cryptkey=/dev/disk/by-uuid/{{ efi_device_uuid.stdout }}:vfat:{{ luks_usb_keyfile | regex_replace('^/efi', '') }}"
    backup: true
  when: enable_encryption

- name: Enable GRUB cryptodisk for encrypted Btrfs /boot
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: "^#?GRUB_ENABLE_CRYPTODISK="
    line: "GRUB_ENABLE_CRYPTODISK=y"
    backup: true
  when: enable_encryption

- name: Configure GRUB for non-encryption
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: "^GRUB_CMDLINE_LINUX="
    line: 'GRUB_CMDLINE_LINUX=""'
    backup: true
  when: not enable_encryption

- name: Enable GRUB OS prober
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: "^#?GRUB_DISABLE_OS_PROBER="
    line: "GRUB_DISABLE_OS_PROBER=false"
    backup: true

- name: Remove rootflags auto-generation from GRUB script for rollback compatibility
  ansible.builtin.replace:
    path: /etc/grub.d/10_linux
    regexp: 'rootflags=subvol=\$\{rootsubvol\} '
    replace: ''
    backup: true

- name: Create pacman hooks directory
  ansible.builtin.file:
    path: /etc/pacman.d/hooks
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create ALPM hook to maintain GRUB rollback compatibility after grub updates
  ansible.builtin.copy:
    dest: /etc/pacman.d/hooks/fix-grub-rollback.hook
    owner: root
    group: root
    mode: "0644"
    content: |
      [Trigger]
      Operation = Install
      Operation = Upgrade
      Type = Package
      Target = grub

      [Action]
      Description = Fixing GRUB rollback compatibility after grub update
      When = PostTransaction
      Exec = /bin/sh -c 'sed -i "s/rootflags=subvol=\${rootsubvol} //" /etc/grub.d/10_linux && grub-mkconfig -o /boot/grub/grub.cfg'

- name: Install GRUB to EFI (standard for non-encrypted systems)
  ansible.builtin.command: grub-install --target=x86_64-efi --efi-directory=/efi --bootloader-id=arch
  changed_when: true
  when: not enable_encryption

- name: Generate GRUB configuration
  ansible.builtin.command: grub-mkconfig -o /boot/grub/grub.cfg
  changed_when: true
