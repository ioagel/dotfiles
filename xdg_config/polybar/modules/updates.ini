[module/updates]
type = custom/script

; yay -Qu checks BOTH repos and AUR. 
; We redirect stderr to /dev/null so "database is up to date" messages don't break the count.
exec = yay -Qu 2>/dev/null | wc -l

; How often to check (in seconds) - 3600s is 1 hour
interval = 3600

; Note: Make sure you have a Nerd Font installed and defined in your bar
label = %output%

; Optional: Change color if updates are available
format-prefix = "󰚰 "
format-prefix-foreground = ${colors.primary}

; Left click: Update EVERYTHING. Right click: Refresh the badge.
click-left = wezterm start -- bash -c "yay -Syu; echo 'Done! Press enter to close...'; read"
click-right = polybar-msg action "#updates.exec"
